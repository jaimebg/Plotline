<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="frame.css">
<style>
  .frame { width: 1320px; height: 2868px; }
  .sheet { width: 10560px; height: 2868px; }
  .headline { left: 7%; right: 7%; top: 5.5%; font-size: 7.4cqw; }
  .headline.centred { text-align: center; }
  .chip { left: 7%; top: 21%; font-size: 3.1cqw; padding: 1.1cqw 2.6cqw; }
  .chip.centred { left: 50%; transform: translateX(-50%); }
</style></head><body>
<div class="sheet" id="sheet"></div>
<div id="font-probe">Plotline</div>
<script src="curve.js"></script>
<script>
// Chip text is transcribed from the capture beneath it. See the spec's copy
// rule: the app recomputes live, so the dataset is not a source for these.
var FRAMES = [
  { head: 'A 0–100 score,<br>and the <em>arithmetic</em><br>behind it',
    chip: 'LEVEL <b>86</b> · CONSISTENCY <b>55</b> · TRAJECTORY <b>64</b>' },
  { head: 'It tells you where<br>a series <em>falls off</em>',
    chip: 'BEFORE <b>8.5</b> → AFTER <b>8.0</b>' },
  { head: 'Pick a season.<br>Every episode,<br><em>plotted</em>',
    chip: 'SEASON 1 · AVG <b>8.4</b>' },
  { head: 'Every rated episode,<br><em>at a glance</em>', chip: null, centred: true },
  { head: 'Shelves you won\'t<br>find <em>anywhere else</em>', chip: null, centred: true },
  { head: 'Where to watch it,<br><em>in your region</em>', chip: null },
  { head: 'Any two titles,<br><em>side by side</em>', chip: null },
  { head: 'Decade against decade,<br><em>charted</em>', chip: null }
];

// One upright device per frame, centred. An earlier version tilted the
// heroes across two shared three-frame scenes and slid smaller supporting
// devices in behind them at the frame boundaries; the second phone read as
// clutter, and the device box was 1320:2400 against captures that are
// 1320:2868, so every phone looked squat and lost the bottom of its screen
// to object-fit: cover. The gold curve still runs across all eight frames,
// so the strip keeps its continuity without the scenes.
//
// The screen keeps the capture's own 1320:2868 ratio (.phone img), so nothing
// is cropped. 27% from the top clears the tallest headline-plus-chip
// (frames 1-3); at 64cqw the device ends near 92% of the frame. render.sh's
// hero probe (HERO_Y) is derived from these two numbers — change them
// together.
var DEVICE_TOP = 27;
var DEVICE_WIDTH = 64;

function device(shot) {
  return '<div class="device phone" style="left:50%;top:' + DEVICE_TOP + '%;width:' +
    DEVICE_WIDTH + 'cqw;transform:translateX(-50%)">' +
    '<div class="island"></div>' +
    '<img src="../../screenshots/raw/iphone-69/' + shot + '.png" alt=""></div>';
}

var out = '';
for (var i = 0; i < 8; i++) {
  var f = FRAMES[i];
  out += '<div class="frame">' + PlotlineCurve.svg(i, 8);
  out += device('0' + (i + 1));
  out += '<div class="headline' + (f.centred ? ' centred' : '') + '">' + f.head + '</div>';
  if (f.chip) out += '<div class="chip' + (f.centred ? ' centred' : '') + '">' + f.chip + '</div>';
  out += '</div>';
}
document.getElementById('sheet').innerHTML = out;
document.title = 'ready:' + document.getElementById('font-probe').getBoundingClientRect().width.toFixed(1);
</script></body></html>
